<!doctype html>
<html lang="is">
  <head>
    <script>
      // Applies the right theme before first paint, so there's no flash of
      // the wrong theme while React/themeStore.ts spins up. Kept in sync
      // with themeStore.ts's own resolution logic - localStorage key and
      // default-to-dark fallback must match exactly.
      (function () {
        try {
          var stored = localStorage.getItem('mmr_theme_mode');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="A party game for friends: submit songs anonymously, guess who picked what, and rate them — how well do you know your friends' music taste?"
    />
    <title>Music Mind Reader</title>
    <script data-goatcounter="https://netnotandi.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
